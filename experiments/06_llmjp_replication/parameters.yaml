experiment:
  id: "06_llmjp_replication"
  title: "LLM-jp Cross-Model Replication"

benchmark:
  version: "v1.0"
  scene: "EP01_SC02"
  path: "benchmark/v1.0/inputs/EP01_SC02"

runtime:
  platform: "Kaggle Notebook"
  gpu: "Tesla T4 x2"
  framework: "Hugging Face Transformers"
  dtype: "float16"
  python: "3.12.13"
  pytorch: "2.10.0+cu128"
  transformers: "5.0.0"
  cuda_runtime: "12.8"
  gpu_count: 2
  gpu: "Tesla T4 x2"
  runtime_status: "PASS_WITH_STABILITY_ADJUSTMENT"
  device_map_strategy: "balanced"
  max_memory:
    gpu_0: "12GiB"
    gpu_1: "12GiB"
    cpu: "24GiB"
  note: >
    Stage 1 passed in FP16 across two Tesla T4 GPUs. Although this PyTorch
    runtime reports BF16 support, FP16 is retained to avoid changing a
    validated runtime variable.

model:
  model_id: "llm-jp/llm-jp-4-8b-instruct"
  revision: "098f2b2cf33021eba19a6d3582aa3d071ccc0aff"
  variant: "instruct"
  reasoning_mode: "non-thinking"

generation:
  status: "frozen_stage_2"
  do_sample: true
  temperature: 0.7
  top_p: 0.95
  repetition_penalty: 1.05
  max_new_tokens: 2000
  pad_token_id_policy: "use tokenizer.eos_token_id"
  note: >
    Parameters are frozen after successful Stage 1 runtime validation.
    temperature, top_p, and repetition_penalty follow the LLM-jp usage example.
    No additional top_k or min_p filter is introduced.

seeds:
  - 42
  - 31415
  - 27182

baseline_inputs:
  - "benchmark/v1.0/inputs/EP01_SC02/scene_card.yaml"
  - "benchmark/v1.0/inputs/EP01_SC02/character_context.yaml"
  - "benchmark/v1.0/inputs/EP01_SC02/addressing_rules.yaml"
  - "benchmark/v1.0/inputs/EP01_SC02/style_guide.yaml"

conditions:

  C0:
    label: "Baseline"
    additional_inputs: []

  C1:
    label: "Scene Boundary"
    additional_inputs:
      - "experiments/06_llmjp_replication/constraints/scene_boundary.yaml"

  C2:
    label: "Reveal Constraints"
    additional_inputs:
      - "experiments/06_llmjp_replication/constraints/reveal_constraints.yaml"

  C3:
    label: "Scene Boundary + Reveal Constraints"
    additional_inputs:
      - "experiments/06_llmjp_replication/constraints/scene_boundary.yaml"
      - "experiments/06_llmjp_replication/constraints/reveal_constraints.yaml"

comparison_policy:
  within_model: "strict"
  cross_model: "practical"
