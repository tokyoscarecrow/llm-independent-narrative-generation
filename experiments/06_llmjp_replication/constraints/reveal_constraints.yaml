reveal_constraints:
  purpose: "EP01_SC02では、みず葉が隼太を気にかける理由を伏せたままにする"

  allowed_information:
    - "みず葉が隼太を気にかけていること"
    - "みず葉が隼太の表情や様子をよく見ていること"
    - "二人の間に、説明されていない何かがあるように感じられること"
    - "隼太が理由を明確には理解していないこと"

  forbidden_information:
    - "みず葉が隼太を気にかける具体的な理由"
    - "みず葉が隼太を守ろうとしている具体的な理由"
    - "幼少期に起きた事件の内容"
    - "隼太の魔法に関する過去の出来事"
    - "SC03で回収される背景情報"
    - "Scene Questionへの明示的な回答"

  prohibited_expression:
    - "みず葉本人に理由を説明させない"
    - "隼太の内心で理由を断定させない"
    - "地の文で理由を説明しない"
    - "『次の章で明らかになる』などメタ的に予告しない"

  target_effect:
    - "読者に『なぜみず葉は隼太を気にかけているのか』という疑問を残す"
    - "答えではなく、違和感または予感として残す"

  output_note:
    - "この制約自体を本文中で説明しない"
